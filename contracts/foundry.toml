[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
robinhood = { key = "blockscout", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }

[fmt]
line_length = 110
[lint]
lint_on_build = false
